{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
{% endblock %}

{% block content %}
    <body>
        <h1>Sign2Text</h1>

        <video id="camera" autoplay playsinline muted></video>

        <div>
            <button id="start">Start Camera</button>
            <button id="stop" disabled>End Camera</button>
        </div>

        <p id="message"></p>
        <p id="result"></p>

        <script>
            const video = document.getElementById("camera");
            const startButton = document.getElementById("start");
            const stopButton = document.getElementById("stop");
            const message = document.getElementById("message");

            let stream = null;

            startButton.addEventListener("click", async () => {
                startButton.disabled = true;
                message.textContent = "";

                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: 400, height: 400 },
                        audio: false
                    });

                    video.srcObject = stream;
                    stopButton.disabled = false;
                } catch (error) {
                    message.textContent = `Could not access camera: ${error.message}`;
                    startButton.disabled = false;
                }
            });

            stopButton.addEventListener("click", () => {
                stream = null;
                video.srcObject = null;

                startButton.disabled = false;
                stopButton.disabled = true;
            });

            const canvas = document.createElement("canvas");

            setInterval(() => {
                if (!stream) return;
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext("2d").drawImage(video, 0, 0);
                canvas.toBlob(async (blob) => {
                    const form = new FormData();
                    form.append("frame", blob, "frame.jpg");
                    const response = await fetch("/api/frame", { method: "POST", body: form });
                    const data = await response.json();
                    document.getElementById("result").textContent = data.text;
                }, "image/jpeg");
            }, 1000);
        </script>

        <hr />
        <h2>Translated Letters</h2>
        <button id="seedBtn" type="button">Load Sample Letters</button>
        <button id="clearBtn" type="button">Clear Predictions</button>
        <ul id="predictions"></ul>

        <script>
            const list = document.getElementById("predictions");

            async function refreshLetters() {
                const letters = await fetch("/api/predictions").then((r) => r.json());

                if (letters.length === 0) {
                    list.innerHTML = "<li>No letters yet.</li>";
                    return;
                }

                let html = "";
                for (const item of letters) {
                    const percent = Math.round(item.confidence * 100);
                    html += `<li><strong>${item.letter}</strong> (${percent}%)</li>`;
                }
                list.innerHTML = html;
            }

            document.getElementById("seedBtn").onclick = async () => {
                await fetch("/api/seed", { method: "POST" });
                refreshLetters();
            };

            document.getElementById("clearBtn").onclick = async () => {
                await fetch("/api/predictions", { method: "DELETE" });
                refreshLetters();
            };

            refreshLetters();
        </script>
    </body>
{% endblock %}
