version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: s2t-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  ml-client:
    build: ./machine-learning-client
    container_name: ml-client
    ports:
      - '6700:6700'
    environment:
      MONGO_URI: mongodb://mongo:27017/sign2text
    depends_on:
      - mongo
  
  web-app:
    build: ./web-app
    container_name: web-app
    environment:
      MONGO_URI: mongodb://mongo:27017/sign2text
    ports:
      - 5000:5000
    depends_on:
      - mongo

volumes:
  mongo-data: