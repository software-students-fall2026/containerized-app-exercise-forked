name: ml-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: machine-learning-client
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Install pipenv and Pipfile packages
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --dev
      - name: Run machine learning client tests with coverage
        run: |
          pipenv install pytest
          pipenv --venv
          pipenv run pytest ../tests/test_ml --cov=. --cov-report=term-missing --cov-fail-under=80